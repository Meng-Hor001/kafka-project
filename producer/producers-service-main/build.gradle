plugins {
    id 'spring-boot-common-conventions'
}

repositories {
    mavenCentral()
}

dependencies {
    implementation project(':producer-service-infrastructure')
    implementation project(':producer-service-application')
    implementation project(':producer-service-restapi')

    implementation 'org.springframework.boot:spring-boot-starter-webmvc'
}

test {
    useJUnitPlatform()
}